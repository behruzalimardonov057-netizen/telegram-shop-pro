<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#ffffff" />
<title>Baraka Shop</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root{
    --bg:#ffffff; --surface:#f5f4f8; --text:#12121c; --hint:#8b8fa3;
    --brand:#8b2bd9; --brand2:#c026d3; --brandText:#ffffff; --accent:#ec4899;
    --line:color-mix(in srgb, var(--text) 10%, transparent);
  }
  html[data-theme="dark"]{
    --bg:#0b0b11; --surface:#17171f; --text:#f3f3f7; --hint:#9aa0b0;
    --brand:#a855f7; --brand2:#e879f9; --brandText:#ffffff; --accent:#f472b6;
    --line:color-mix(in srgb, #ffffff 12%, transparent);
  }
  html[data-theme="pink"]{
    --bg:#fff7fb; --surface:#ffe9f4; --text:#3d0a26; --hint:#a9718f;
    --brand:#e5308f; --brand2:#ff7ab8; --brandText:#ffffff; --accent:#e5308f;
    --line:color-mix(in srgb, #e5308f 16%, transparent);
  }
  html[data-theme="blue"]{
    --bg:#f5f9ff; --surface:#e6efff; --text:#08203f; --hint:#6b86ab;
    --brand:#1d5cf5; --brand2:#4aa8ff; --brandText:#ffffff; --accent:#1d5cf5;
    --line:color-mix(in srgb, #1d5cf5 16%, transparent);
  }
  html{transition:background .25s ease}
  .brand-grad{background:linear-gradient(135deg,var(--brand),var(--brand2))}
  .press{transition:transform .12s ease}
  .press:active{transform:scale(.94)}
  .pop{animation:pop .35s cubic-bezier(.2,1.4,.4,1) both}
  @keyframes pop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
  .float{animation:fl 3.4s ease-in-out infinite}
  @keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  html,body,#root{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
  .no-scrollbar::-webkit-scrollbar{display:none}
  .no-scrollbar{scrollbar-width:none}
  .line-clamp-1,.line-clamp-2{display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden}
  .line-clamp-1{-webkit-line-clamp:1}.line-clamp-2{-webkit-line-clamp:2}
  .fadein{animation:f .28s cubic-bezier(.22,1,.36,1) both}
  @keyframes f{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .divider{border-top:1px solid var(--line)}

  .topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:.6rem;padding:.7rem 1rem;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  .icon-btn{width:36px;height:36px;border-radius:999px;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:18px;border:0;color:inherit}
  .section-title{font-size:16px;font-weight:700;margin-bottom:.6rem}

  .bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
  .navbtn{flex:1;padding:.5rem 0 .45rem;display:flex;flex-direction:column;align-items:center;position:relative;border:0;background:none;color:var(--hint)}
  .navbtn-on{color:var(--brand)}
  .badge{position:absolute;top:2px;right:24%;background:#ef4444;color:#fff;font-size:10px;min-width:18px;height:18px;border-radius:999px;display:flex;align-items:center;justify-content:center;padding:0 4px}

  .card-box{background:var(--surface);border-radius:18px;padding:1rem}
  .menu-row{display:flex;align-items:center;justify-content:space-between;width:100%;background:var(--surface);border-radius:18px;padding:1rem;border:0;color:inherit;font-size:15px;text-decoration:none}
  .searchbar{display:flex;align-items:center;gap:.6rem;width:100%;background:var(--surface);border-radius:999px;padding:.75rem 1rem;border:0;color:inherit}
  .notice{background:color-mix(in srgb,var(--brand) 12%,transparent);color:var(--text);border-radius:14px;padding:.6rem .9rem;font-size:12.5px;text-align:center}

  .chip{flex-shrink:0;padding:.4rem .9rem;border-radius:999px;background:var(--surface);font-size:13px;border:0;color:inherit;appearance:none}
  .chip-on{background:var(--brand);color:var(--brandText)}
  .opt{padding:.6rem 1rem;border-radius:14px;background:var(--surface);font-size:14px;border:0;color:inherit}
  .opt-on{background:var(--brand);color:var(--brandText)}
  .btn-primary{background:var(--brand);color:var(--brandText);border:0;border-radius:16px;padding:.85rem 1rem;font-weight:600;font-size:15px}
  .btn-primary:disabled{opacity:.45}
  .lbl{font-size:11.5px;opacity:.6}
  .fld{width:100%;background:var(--surface);border:1px solid transparent;border-radius:14px;padding:.7rem .85rem;margin-top:.25rem;outline:none;color:inherit;font-size:15px}
  .fld:focus{border-color:var(--brand)}

  .cat-chip{flex-shrink:0;width:78px;display:flex;flex-direction:column;align-items:center;gap:.35rem;border:0;background:none;color:inherit}
  .cat-ico{width:62px;height:62px;border-radius:999px;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:28px}

  .pcard{background:var(--surface);border-radius:18px;overflow:hidden;transition:transform .15s}
  .pcard:active{transform:scale(.96)}
  .pcard-img{position:relative;aspect-ratio:3/4;overflow:hidden;background:color-mix(in srgb,var(--text) 6%,transparent)}
  .pcard-img img{width:100%;height:100%;object-fit:cover}
  .ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:32px;opacity:.35}
  .tag-sale{position:absolute;top:8px;left:8px;background:#ef4444;color:#fff;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px}
  .soldout{position:absolute;inset:0;background:rgba(0,0,0,.45);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}

  .hero-img{aspect-ratio:3/4;overflow:hidden;background:color-mix(in srgb,var(--text) 6%,transparent)}
  .hero-img img{width:100%;height:100%;object-fit:cover}
  .fav-btn{position:absolute;top:12px;right:12px;width:42px;height:42px;border-radius:999px;background:rgba(255,255,255,.92);border:0;font-size:19px;box-shadow:0 4px 14px rgba(0,0,0,.15)}
  .thumb{width:54px;height:54px;border-radius:12px;overflow:hidden;flex-shrink:0;border:2px solid transparent;padding:0;background:none}
  .thumb-on{border-color:var(--brand)}
  .thumb img{width:100%;height:100%;object-fit:cover}

  .qty{display:flex;align-items:center;gap:.15rem;background:var(--surface);border-radius:999px;padding:.2rem}
  .qty button{width:32px;height:32px;border-radius:999px;border:0;background:transparent;color:inherit;font-size:17px}
  .qty span{min-width:26px;text-align:center;font-size:14px;font-weight:600}
  .qty-sm button{width:28px;height:28px;font-size:15px}

  .cart-row{display:flex;gap:.75rem;background:var(--surface);border-radius:18px;padding:.7rem}
  .cart-img{width:78px;height:96px;border-radius:12px;overflow:hidden;flex-shrink:0;background:color-mix(in srgb,var(--text) 6%,transparent)}
  .cart-img img{width:100%;height:100%;object-fit:cover}

  .stickybar{position:fixed;left:0;right:0;bottom:calc(60px + env(safe-area-inset-bottom));z-index:25;display:flex;gap:.6rem;padding:.7rem 1rem;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--line)}

  .summary{background:var(--surface);border-radius:18px;padding:1rem;display:flex;flex-direction:column;gap:.35rem;font-size:14px}
  .row{display:flex;justify-content:space-between}
  .total{font-weight:700;font-size:17px;padding-top:.5rem;border-top:1px solid var(--line);margin-top:.25rem}

  .st{font-size:11px;font-weight:600;padding:3px 10px;border-radius:999px}
  .st-blue{background:#dbeafe;color:#1d4ed8}.st-green{background:#dcfce7;color:#15803d}
  .st-amber{background:#fef3c7;color:#b45309}.st-red{background:#fee2e2;color:#b91c1c}

  .avatar{width:54px;height:54px;border-radius:999px;background:var(--brand);color:var(--brandText);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;text-transform:uppercase}

  .banner{position:relative;aspect-ratio:16/9;border-radius:18px;overflow:hidden;background:var(--surface)}
  .banner img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .6s}
  .dots{position:absolute;bottom:8px;left:0;right:0;display:flex;justify-content:center;gap:5px}
  .dot{width:6px;height:6px;border-radius:999px;background:rgba(255,255,255,.5)}
  .dot.on{background:#fff;width:16px}

  .skel{background:linear-gradient(90deg,var(--surface) 25%,color-mix(in srgb,var(--text) 8%,var(--surface)) 37%,var(--surface) 63%);background-size:400% 100%;animation:sh 1.3s infinite;border-radius:14px}
  @keyframes sh{0%{background-position:100% 0}100%{background-position:-100% 0}}

  .toast-wrap{position:fixed;left:0;right:0;bottom:calc(78px + env(safe-area-inset-bottom));z-index:60;display:flex;flex-direction:column;align-items:center;gap:.4rem;pointer-events:none;padding:0 1rem}
  .toast{background:rgba(17,24,39,.94);color:#fff;font-size:13px;padding:.6rem 1rem;border-radius:14px;max-width:100%;animation:f .2s both;box-shadow:0 8px 24px rgba(0,0,0,.2)}
  .toast.ok{background:#15803d}.toast.err{background:#b91c1c}

  /* --- Splash --- */
  #splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.1rem;background:linear-gradient(160deg,var(--brand),var(--brand2));color:#fff;transition:opacity .45s ease,visibility .45s}
  #splash.hide{opacity:0;visibility:hidden}
  .sp-ring{width:74px;height:74px;border-radius:999px;border:3px solid rgba(255,255,255,.25);border-top-color:#fff;animation:spin .8s linear infinite;display:flex;align-items:center;justify-content:center}
  .sp-ring span{font-size:30px;animation:fl 1.6s ease-in-out infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .sp-name{font-size:19px;font-weight:800;letter-spacing:.3px;animation:pop .5s both}
  .sp-bar{width:130px;height:4px;border-radius:99px;background:rgba(255,255,255,.25);overflow:hidden}
  .sp-bar i{display:block;height:100%;width:40%;border-radius:99px;background:#fff;animation:slide 1.1s ease-in-out infinite}
  @keyframes slide{0%{transform:translateX(-110%)}100%{transform:translateX(260%)}}

  /* --- Home v3 --- */
  .locbar{display:flex;align-items:center;justify-content:space-between;padding:.75rem 1rem .2rem;font-size:12.5px}
  .hero{position:relative;overflow:hidden;border-radius:22px;padding:1.15rem 1.15rem 1.3rem;color:#fff;background:linear-gradient(135deg,var(--brand),var(--brand2));box-shadow:0 14px 32px -14px color-mix(in srgb,var(--brand) 70%,transparent)}
  .hero:after{content:"";position:absolute;width:190px;height:190px;border-radius:999px;background:rgba(255,255,255,.13);right:-60px;top:-70px}
  .hero-cta{display:inline-flex;align-items:center;gap:.4rem;background:#fff;color:var(--brand);font-weight:700;font-size:14px;padding:.6rem 1.1rem;border-radius:999px;border:0}
  .cat-tile{display:flex;flex-direction:column;align-items:center;gap:.5rem;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:.9rem .4rem;border:0;color:inherit;transition:transform .15s}
  .cat-tile:active{transform:scale(.95)}
  .cat-tile .ico{width:48px;height:48px;border-radius:999px;background:color-mix(in srgb,var(--brand) 14%,transparent);display:flex;align-items:center;justify-content:center;font-size:23px}
  .tag-new{position:absolute;top:8px;left:8px;background:var(--accent);color:#fff;font-size:10px;font-weight:800;padding:3px 9px;border-radius:999px;letter-spacing:.4px}
  .tag-cheap{position:absolute;bottom:8px;left:8px;background:var(--accent);color:#fff;font-size:9.5px;font-weight:800;padding:3px 8px;border-radius:999px;letter-spacing:.5px}
  .fav-mini{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:999px;background:color-mix(in srgb,var(--bg) 88%,transparent);border:0;font-size:14px;display:flex;align-items:center;justify-content:center;color:inherit}
  .price-hot{color:var(--accent);font-weight:800;font-size:17px}
  .off-pill{color:var(--accent);font-size:11.5px;font-weight:700}
  .btn-soft{width:100%;background:color-mix(in srgb,var(--brand) 10%,transparent);color:var(--brand);border:0;border-radius:12px;padding:.5rem;font-size:12.5px;font-weight:600}
  .see-all{color:var(--accent);font-size:12.5px;font-weight:600;background:none;border:0}
  .theme-dot{display:flex;flex-direction:column;align-items:center;gap:.35rem;background:none;border:0;color:inherit;font-size:11px}
  .theme-dot i{width:38px;height:38px;border-radius:999px;border:2px solid var(--line);display:block}
  .theme-dot.on i{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 22%,transparent)}
</style>
</head>
<body>
<script>try{var _t=localStorage.getItem("theme")||"light";if(!["light","dark","pink","blue"].includes(_t))_t="light";document.documentElement.dataset.theme=_t}catch(e){}</script>
<div id="splash">
  <div class="sp-ring"><span>👗</span></div>
  <div class="sp-name">Baraka Moda</div>
  <div class="sp-bar"><i></i></div>
</div>
<div id="root"></div>
<script type="module" src="/assets/miniapp.js"></script>
</body>
</html>
